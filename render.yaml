services:
  - type: web
    name: reto-03-ordenes-compra
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: MAX_ITERACIONES_POR_TURNO
        value: "25"
      - key: MAX_TOKENS_POR_SESION
        value: "200000"
      - key: MAX_TOKENS_POR_DIA
        value: "3000000"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_KEY
        sync: false
